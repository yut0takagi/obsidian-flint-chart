name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # So a run can be repeated after a flake, or against a dependency bump,
  # without inventing a commit to hang it on.
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes whatever the previous one was still checking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One version failing should not hide what the other one would have said.
      fail-fast: false
      matrix:
        # Node only builds the plugin; it runs inside Obsidian. 22 is what the
        # release builds on, 24 is where the toolchain is moving.
        node: [22, 24]
    steps:
      # Actions are pinned to a commit, because a tag can be moved to point at
      # something else. The comment says which release it was.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The community-plugin review gates: no innerHTML, no Node built-ins,
      # manifest and versions.json in step, NOTICE present.
      - name: Plugin checks
        run: npm run check:plugin

      - name: Build
        run: npm run build

      # The same three files a release ships, so a change can be tried in a
      # vault straight from the pull request. One Node version is enough.
      - name: Upload plugin build
        if: matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flint-chart
          path: |
            main.js
            manifest.json
            styles.css
